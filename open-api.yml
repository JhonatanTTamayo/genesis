          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/metrics/token-consumption:
    get:
      tags:
        - Metrics
      summary: Get daily token consumption (admin)
      operationId: getTokenConsumptionMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metric retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenConsumptionMetricResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/metrics/top-operations:
    get:
      tags:
        - Metrics
      summary: Get most executed operations (admin)
      operationId: getTopOperationsMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metric retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopOperationsMetricResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/metrics/top-users:
    get:
      tags:
        - Metrics
      summary: Get users with highest token consumption (admin)
      operationId: getTopUsersMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metric retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUsersMetricResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          maxLength: 150
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          minLength: 8
          example: 12345678

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          example: USER
        active:
          type: boolean
          example: true
        tokenBalance:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-04-06T10:00:00'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          example: 12345678

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: jwt-token-here
        type:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 86400

    PlanSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Pro
        tokenAmount:
          type: integer
          example: 1000

    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          example: USER
        active:
          type: boolean
          example: true
        tokenBalance:
          type: integer
          example: 1200
        activePlan:
          $ref: '#/components/schemas/PlanSummaryResponse'

    UserListItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        active:
          type: boolean
          example: true
        tokenBalance:
          type: integer
          example: 1200
        activePlan:
          $ref: '#/components/schemas/PlanSummaryResponse'

    UserPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserListItemResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 15
        totalPages:
          type: integer
          example: 2
        last:
          type: boolean
          example: false

    UserStatusUpdateRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          example: true

    UserStatusResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: john.doe@example.com
        active:
          type: boolean
          example: true
        resultMessage:
          type: string
          example: User status updated successfully

    PlanItemResponse:
      type: object
      properties:
        planId:
          type: integer
          format: int64
          example: 1
        planName:
          type: string
          example: Free
        planDescription:
          type: string
          example: Plan base gratuito
        tokenLimitPerCycle:
          type: integer
          example: 200
        billingCycleDurationSeconds:
          type: integer
          example: 2592000

    ListPlansResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PlanItemResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 3
        totalPages:
          type: integer
          example: 1
        last:
          type: boolean
          example: true

    CreatePlanRequest:
      type: object
      required:
        - planName
        - planDescription
        - tokenLimitPerCycle
        - billingCycleDurationSeconds
      properties:
        planName:
          type: string
          example: Pro Plus
        planDescription:
          type: string
          example: Plan profesional con mayor capacidad
        tokenLimitPerCycle:
          type: integer
          minimum: 1
          example: 2500
        billingCycleDurationSeconds:
          type: integer
          minimum: 1
          example: 2592000
        versionValidTo:
          type: string
          format: date-time
          nullable: true
          description: Optional end date for this plan version. Alias valid_to is also accepted.
          example: '2026-05-12T12:00:00'
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: JSON alias for versionValidTo.
          example: '2026-05-12T12:00:00'

    CreatePlanResponse:
      type: object
      properties:
        planId:
          type: integer
          format: int64
          example: 5
        planName:
          type: string
          example: Pro Plus
        planDescription:
          type: string
          example: Plan profesional con mayor capacidad
        tokenLimitPerCycle:
          type: integer
          example: 2500
        billingCycleDurationSeconds:
          type: integer
          example: 2592000
        versionValidTo:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-12T12:00:00'

    UpdatePlanRequest:
      type: object
      description: versionValidFrom is always generated by the system.
      required:
        - planName
        - planDescription
        - tokenLimitPerCycle
        - billingCycleDurationSeconds
      properties:
        planName:
          type: string
          example: Pro Plus
        planDescription:
          type: string
          example: Plan profesional con mayor capacidad
        tokenLimitPerCycle:
          type: integer
          minimum: 1
          example: 2500
        billingCycleDurationSeconds:
          type: integer
          minimum: 1
          example: 2592000
        versionValidTo:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-12T12:00:00'

    UpdatePlanResponse:
      type: object
      properties:
        planId:
          type: integer
          format: int64
          example: 5
        planName:
          type: string
          example: Pro Plus
        planDescription:
          type: string
          example: Plan profesional con mayor capacidad
        tokenLimitPerCycle:
          type: integer
          example: 2500
        billingCycleDurationSeconds:
          type: integer
          example: 2592000
        versionValidFrom:
          type: string
          format: date-time
          example: '2026-04-12T12:00:00'
        versionValidTo:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-12T12:00:00'
        currentlyAvailable:
          type: boolean
          example: true

    UpdatePlanStatusRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          example: true

    UpdatePlanStatusResponse:
      type: object
      properties:
        planId:
          type: integer
          format: int64
          example: 5
        active:
          type: boolean
          example: true
        message:
          type: string
          example: Plan status updated successfully

    DeletePlanResponse:
      type: object
      properties:
        planId:
          type: integer
          format: int64
          example: 5
        deleted:
          type: boolean
          example: true
        message:
          type: string
          example: Plan eliminado exitosamente

    SubscriptionPlanResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: Pro
        tokenAmount:
          type: integer
          example: 1000

    SubscriptionCreateRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: integer
          format: int64
          minimum: 1
          example: 2

    CreateSubscriptionResponse:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/SubscriptionPlanResponse'
        newTokenBalance:
          type: integer
          example: 1200
        startDate:
          type: string
          format: date-time
          example: '2026-04-06T10:30:00'
        endDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-06T10:30:00'

    MyActiveSubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 8
        plan:
          $ref: '#/components/schemas/SubscriptionPlanResponse'
        startDate:
          type: string
          format: date-time
          example: '2026-04-06T10:30:00'
        endDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-06T10:30:00'
        active:
          type: boolean
          example: true

    ListSubscriptionHistoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 8
        planName:
          type: string
          example: Pro
        startDate:
          type: string
          format: date-time
          example: '2026-04-06T10:30:00'
        endDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-06T10:30:00'
        active:
          type: boolean
          example: false

    OperationCatalogResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: OP-01
        name:
          type: string
          example: Credit payment calculator
        description:
          type: string
          example: Calculate monthly payment and amortization schedule
        baseCost:
          type: integer
          example: 50
        active:
          type: boolean
          example: true

    UpdateOperationStatusRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          example: true

    CreditExecutionRequest:
      type: object
      required:
        - amount
        - installments
        - monthlyRate
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 10000000
        installments:
          type: integer
          minimum: 1
          example: 24
        monthlyRate:
          type: number
          format: double
          minimum: 0.01
          example: 1.5

    CreditExecutionAmortizationItem:
      type: object
      properties:
        month:
          type: integer
          example: 1
        interestPaid:
          type: number
          format: double
          example: 150000
        principalPaid:
          type: number
          format: double
          example: 350000
        remainingBalance:
          type: number
          format: double
          example: 9650000

    CreditExecutionResponse:
      type: object
      properties:
        monthlyPayment:
          type: number
          format: double
          example: 500000
        totalPaid:
          type: number
          format: double
          example: 12000000
        totalInterest:
          type: number
          format: double
          example: 2000000
        amortizationSchedule:
          type: array
          items:
            $ref: '#/components/schemas/CreditExecutionAmortizationItem'

    CurrencyConverterRequest:
      type: object
      required:
        - amount
        - sourceCurrency
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          example: 100
        sourceCurrency:
          type: string
          enum:
            - USD
            - COP
          example: USD

    CurrencyConverterResponse:
      type: object
      properties:
        convertedAmount:
          type: number
          format: double
          example: 400000
        conversionDirection:
          type: string
          enum:
            - USD_TO_COP
            - COP_TO_USD
          example: USD_TO_COP
        appliedRate:
          type: number
          format: double
          example: 4000
        rateLastUpdatedAt:
          type: string
          format: date-time
          example: '2026-04-06T08:00:00'

    BMIRequest:
      type: object
      required:
        - weightKg
        - heightCm
      properties:
        weightKg:
          type: number
          format: double
          minimum: 0.01
          example: 70
        heightCm:
          type: number
          format: double
          minimum: 0.01
          example: 175

    BMIResponse:
      type: object
      properties:
        bmi:
          type: number
          format: double
          example: 22.86
        category:
          type: string
          enum:
            - UNDERWEIGHT
            - NORMAL
            - OVERWEIGHT
            - OBESE
          example: NORMAL
        minimumHealthyWeight:
          type: number
          format: double
          example: 56.66
        maximumHealthyWeight:
          type: number
          format: double
          example: 76.26
        weightDifferenceFromRange:
          type: number
          format: double
          example: 0.0

    SleepRequest:
      type: object
      required:
        - mode
        - time
        - sleepDurationMinutes
      properties:
        mode:
          type: string
          enum:
            - WAKE_UP_TIME
            - BEDTIME
          example: WAKE_UP_TIME
        time:
          type: string
          format: time
          example: '06:30:00'
        sleepDurationMinutes:
          type: integer
          minimum: 1
          example: 14

    SleepOption:
      type: object
      properties:
        calculatedTime:
          type: string
          example: '21:16'
        totalSleepHours:
          type: number
          format: double
          example: 9.0
        quality:
          type: string
          example: Ideal

    SleepResponse:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/SleepOption'

    WalletBalanceResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        currentBalance:
          type: integer
          example: 950
        updatedAt:
          type: string
          format: date-time
          example: '2026-04-11T14:30:00'

    TokenRechargeRequest:
      type: object
      required:
        - userId
        - amount
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        amount:
          type: integer
          minimum: 1
          example: 500

    TokenRechargeResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        newBalance:
          type: integer
          example: 1700
        rechargedAmount:
          type: integer
          example: 500
        transactionDate:
          type: string
          format: date-time
          example: '2026-04-06T11:00:00'

    TokenTransactionItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        amount:
          type: integer
          example: 200
        referenceType:
          type: string
          enum:
            - OPERATION_EXECUTION
            - SUBSCRIPTION
            - ADMIN_RECHARGE
          example: OPERATION_EXECUTION
        referenceId:
          type: integer
          format: int64
          nullable: true
          example: 10
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-06T10:30:00'
        createdAt:
          type: string
          format: date-time
          example: '2026-04-11T14:00:00'

    TokenTransactionHistoryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TokenTransactionItemResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 25
        totalPages:
          type: integer
          example: 3
        last:
          type: boolean
          example: false

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 15
        operationId:
          type: integer
          format: int64
          example: 3
        operationCode:
          type: string
          example: OP-03
        operationName:
          type: string
          example: BMI Calculator
        baseCost:
          type: integer
          example: 50
        totalTokensConsumed:
          type: integer
          example: 50
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
          example: SUCCESS
        executedAt:
          type: string
          format: date-time
          example: '2026-04-11T14:30:00'

    TransactionPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 12
        totalPages:
          type: integer
          example: 2
        last:
          type: boolean
          example: false

    ExchangeRateRequest:
      type: object
      required:
        - copPerUsd
      properties:
        copPerUsd:
          type: number
          format: double
          minimum: 0.01
          example: 4000.50

    ExchangeRateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        copPerUsd:
          type: number
          format: double
          example: 4000.50
        updatedAt:
          type: string
          format: date-time
          example: '2026-04-06T11:10:00'

    TokenConsumptionMetricItem:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '2026-04-06'
        tokensConsumed:
          type: integer
          example: 320

    TokenConsumptionMetricResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TokenConsumptionMetricItem'

    TopOperationMetricItem:
      type: object
      properties:
        operationCode:
          type: string
          example: OP-03
        operationName:
          type: string
          example: BMI Calculator
        executions:
          type: integer
          example: 25

    TopOperationsMetricResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopOperationMetricItem'

    TopUserMetricItem:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        fullName:
          type: string
          example: John Doe
        totalTokensConsumed:
          type: integer
          example: 980

    TopUsersMetricResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopUserMetricItem'

    ValidationErrorItem:
      type: object
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: must be a valid email

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Validation error
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
        timestamp:
          type: string
          format: date-time
          example: '2026-04-06T10:30:00'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Resource not found
        timestamp:
          type: string
          format: date-time
          example: '2026-04-06T10:30:00'
