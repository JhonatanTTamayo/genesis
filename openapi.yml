openapi: 3.0.3
info:
  title: Genesis API
  description: API del Proyecto Genesis - Breaze in the Moon
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

tags:
  - name: Auth
    description: Endpoints de autenticación
  - name: Usuarios
    description: Endpoints de perfil del usuario
  - name: Planes
    description: Consulta y gestión de planes
  - name: Suscripciones
    description: Endpoints de suscripción
  - name: Operaciones
    description: Catálogo y ejecución de operaciones
  - name: Transacciones
    description: Historial de transacciones del usuario
  - name: Administración
    description: Endpoints administrativos

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Registrar un nuevo usuario
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Jhonatan Tamayo
              email: jhonatan@example.com
              password: 12345678
      responses:
        '201':
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Autenticar usuario y obtener JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jhonatan@example.com
              password: 12345678
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me:
    get:
      tags:
        - Usuarios
      summary: Obtener perfil del usuario autenticado
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/plans:
    get:
      tags:
        - Planes
      summary: Obtener planes disponibles
      operationId: getPlans
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: name,asc
      responses:
        '200':
          description: Planes obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPageResponse'

  /api/v1/plans/{id}:
    get:
      tags:
        - Planes
      summary: Obtener plan por id
      operationId: getPlanById
      parameters:
        - name: id
          in: path
          required: true
          description: ID del plan
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Plan obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '404':
          description: Plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subscriptions:
    post:
      tags:
        - Suscripciones
      summary: Suscribir usuario autenticado a un plan
      operationId: createSubscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
            example:
              planId: 2
      responses:
        '201':
          description: Suscripción creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subscriptions/me:
    get:
      tags:
        - Suscripciones
      summary: Obtener suscripción activa del usuario autenticado
      operationId: getMySubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suscripción obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubscriptionResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Suscripción activa no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations:
    get:
      tags:
        - Operaciones
      summary: Listar catálogo de operaciones disponibles
      operationId: getOperations
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: code,asc
      responses:
        '200':
          description: Operaciones obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPageResponse'

  /api/v1/operations/{code}:
    get:
      tags:
        - Operaciones
      summary: Obtener operación por código
      operationId: getOperationByCode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: OP-01
      responses:
        '200':
          description: Operación obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '404':
          description: Operación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/credit/execute:
    post:
      tags:
        - Operaciones
      summary: Ejecutar operación de crédito
      operationId: executeCreditOperation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditOperationRequest'
      responses:
        '200':
          description: Operación ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditOperationResponse'
        '400':
          description: Error de validación o regla de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Saldo insuficiente o conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/currency-converter/execute:
    post:
      tags:
        - Operaciones
      summary: Ejecutar conversor COP USD
      operationId: executeCurrencyConverterOperation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyConverterRequest'
      responses:
        '200':
          description: Operación ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyConverterResponse'
        '400':
          description: Error de validación o regla de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Saldo insuficiente o conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/bmi/execute:
    post:
      tags:
        - Operaciones
      summary: Ejecutar calculadora de IMC
      operationId: executeBmiOperation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BmiRequest'
      responses:
        '200':
          description: Operación ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BmiResponse'
        '400':
          description: Error de validación o regla de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Saldo insuficiente o conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/sleep/execute:
    post:
      tags:
        - Operaciones
      summary: Ejecutar calculadora de sueño
      operationId: executeSleepOperation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SleepRequest'
      responses:
        '200':
          description: Operación ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepResponse'
        '400':
          description: Error de validación o regla de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Saldo insuficiente o conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/me:
    get:
      tags:
        - Transacciones
      summary: Obtener historial de transacciones del usuario autenticado
      operationId: getMyTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: executedAt,desc
      responses:
        '200':
          description: Historial obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/{id}:
    get:
      tags:
        - Transacciones
      summary: Obtener detalle de una transacción
      operationId: getTransactionById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Transacción obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transacción no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users:
    get:
      tags:
        - Administración
      summary: Listar usuarios
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: id,asc
      responses:
        '200':
          description: Usuarios obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/activate:
    patch:
      tags:
        - Administración
      summary: Activar usuario
      operationId: activateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario activado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/deactivate:
    patch:
      tags:
        - Administración
      summary: Desactivar usuario
      operationId: deactivateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario desactivado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/recharges:
    post:
      tags:
        - Administración
      summary: Recargar tokens a un usuario
      operationId: rechargeTokens
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechargeRequest'
      responses:
        '201':
          description: Recarga realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/plans:
    post:
      tags:
        - Administración
      summary: Crear plan
      operationId: createPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlanRequest'
      responses:
        '201':
          description: Plan creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

    get:
      tags:
        - Administración
      summary: Listar planes administrativamente
      operationId: getAdminPlans
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: id,asc
      responses:
        '200':
          description: Planes obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPageResponse'

  /api/v1/admin/plans/{id}:
    get:
      tags:
        - Administración
      summary: Obtener plan administrativo por id
      operationId: getAdminPlanById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Plan obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '404':
          description: Plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Administración
      summary: Actualizar plan
      operationId: updatePlan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlanRequest'
      responses:
        '200':
          description: Plan actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Administración
      summary: Eliminar plan
      operationId: deletePlan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Plan eliminado correctamente
        '404':
          description: Plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El plan tiene suscripciones activas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/operations/{code}/activate:
    patch:
      tags:
        - Administración
      summary: Activar operación
      operationId: activateOperation
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operación activada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '404':
          description: Operación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/operations/{code}/deactivate:
    patch:
      tags:
        - Administración
      summary: Desactivar operación
      operationId: deactivateOperation
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operación desactivada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '404':
          description: Operación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/exchange-rate:
    get:
      tags:
        - Administración
      summary: Obtener tasa de cambio actual
      operationId: getExchangeRate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tasa obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'

    put:
      tags:
        - Administración
      summary: Actualizar tasa de cambio
      operationId: updateExchangeRate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateRequest'
      responses:
        '200':
          description: Tasa actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/v1/admin/metrics/token-consumption:
    get:
      tags:
        - Administración
      summary: Obtener tokens consumidos por día
      operationId: getTokenConsumptionMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métrica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenConsumptionMetricResponse'

  /api/v1/admin/metrics/top-operations:
    get:
      tags:
        - Administración
      summary: Obtener operaciones más ejecutadas
      operationId: getTopOperationsMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métrica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopOperationsMetricResponse'

  /api/v1/admin/metrics/top-users:
    get:
      tags:
        - Administración
      summary: Obtener usuarios con mayor consumo
      operationId: getTopUsersMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métrica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUsersMetricResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          maxLength: 150
          example: Jhonatan Tamayo
        email:
          type: string
          format: email
          example: jhonatan@example.com
        password:
          type: string
          minLength: 8
